<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Birch Leaf FA Analyzer</title>
    <meta name="description" content="Мобильное приложение для оценки качества окружающей среды по флуктуирующей асимметрии листьев березы повислой (Betula pendula Roch.)" />
    <meta property="og:title" content="Birch Leaf FA Analyzer" />
    <meta property="og:description" content="Мобильное приложение для оценки качества окружающей среды по флуктуирующей асимметрии листьев березы повислой (Betula pendula Roch.)" />
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PWA configuration for mobile standalone installment -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#065f46" />
    <meta name="color-scheme" content="light" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=192&h=192&q=80" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        if (typeof window !== "undefined" && window.WebSocket) {
          var RealWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var sUrl = String(url || "");
            if (sUrl.includes("vite") || sUrl.includes("ais-dev") || protocols === "vite-hmr" || !protocols) {
              var handlers = {};
              var mock = {
                url: sUrl,
                readyState: 1,
                protocol: protocols || "",
                extensions: "",
                bufferedAmount: 0,
                send: function() {},
                close: function() {
                  mock.readyState = 3;
                  if (typeof mock.onclose === "function") mock.onclose({ type: "close" });
                },
                addEventListener: function(evt, fn) {
                  handlers[evt] = handlers[evt] || [];
                  handlers[evt].push(fn);
                  if (evt === "open") {
                    setTimeout(function() { try { fn({ type: "open" }); } catch(e){} }, 10);
                  }
                },
                removeEventListener: function(evt, fn) {
                  if (handlers[evt]) {
                    handlers[evt] = handlers[evt].filter(function(h) { return h !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              Object.defineProperty(mock, "onopen", { set: function(f) { mock.addEventListener("open", f); } });
              Object.defineProperty(mock, "onmessage", { set: function(f) { mock.addEventListener("message", f); } });
              Object.defineProperty(mock, "onerror", { set: function(f) { mock.addEventListener("error", f); } });
              Object.defineProperty(mock, "onclose", { set: function(f) { mock.addEventListener("close", f); } });
              return mock;
            }
            return new RealWS(url, protocols);
          };
          window.WebSocket.prototype = RealWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener("error", function(e) {
          var s = String(e?.message || e?.filename || e?.error?.stack || "");
          if (s.includes("WebSocket") || s.includes("@vite/client") || s.includes("ModuleRunnerTransport")) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          var s = String(e?.reason?.message || e?.reason?.stack || e?.reason || "");
          if (s.includes("WebSocket") || s.includes("@vite/client") || s.includes("ModuleRunnerTransport")) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Ignore benign WebSocket / dev-transport reconnect attempts in cloud proxy
      window.addEventListener('unhandledrejection', (event) => {
        const str = String(event?.reason?.message || event?.reason || '');
        if (str.includes('WebSocket') || str.includes('vite') || str.includes('ModuleRunnerTransport')) {
          event.preventDefault();
        }
      });
      // Register Service Worker for PWA installation support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully!'))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
